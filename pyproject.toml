[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance"
version = "0.1.0"
description = "Governed agent in the spirit of Palanisamy Ramasamy's governance stack: five controls enforced in code — trusted data with provenance, least-privilege access, output guardrails, human approval for high-impact actions, and a full audit log — plus runtime checks, escalation, and rollback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "langgraph>=0.2",
    "litellm>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
governance-demo = "agent_governance.demo:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
